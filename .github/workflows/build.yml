name: Build

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install GCC
        run: sudo apt-get install -y g++

      - name: Build
        run: make

      - name: Perft smoke-test
        run: ./Terminal-Chess perft
